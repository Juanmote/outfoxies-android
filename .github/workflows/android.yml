name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_TAG: release-2.30.12
  OFX_VERSION: 0.21.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get SDL2
        run: |
          git clone --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git android/app/jni/SDL
          # La parte Java debe ser exactamente la de esta copia de SDL
          cp android/app/jni/SDL/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/

      - name: Build APK
        working-directory: android
        run: |
          NDK_VER=$(grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties" | cut -d= -f2 | tr -d ' ')
          echo "Using NDK $NDK_VER"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PndkVer="$NDK_VER" \
            -PofxVersionCode=${{ github.run_number }} \
            -PofxVersionName="$OFX_VERSION-b${{ github.run_number }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/TheOutfoxiesRemastered-$OFX_VERSION-b${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The Outfoxies Remastered ${{ env.OFX_VERSION }} (build ${{ github.run_number }})
          body: |
            APK de prueba compilado automaticamente desde `${{ github.sha }}`.
            No incluye la ROM: al abrir la app se pide el romset outfxies.zip (World, OU2).
          files: dist/*.apk
